# Coding Engine — Auto-Fix Workflow Template
#
# Triggers on CI/CD failures and creates fix PRs automatically.
# Copy to .github/workflows/fixer.yml and update variables.

name: Auto-Fix

on:
  workflow_run:
    workflows: ["CI"] # UPDATE: List your CI workflow names
    types: [completed]
    branches: [main] # UPDATE: Only fix failures on main branch

concurrency:
  group: fixer-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for existing fix PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_FIX_PRS=$(gh pr list --label "auto-fix" --state open --json number --jq length)
          if [ "$OPEN_FIX_PRS" -ge "3" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Circuit breaker: $OPEN_FIX_PRS fix PRs already open"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect failure context
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          gh run view "$RUN_ID" --log-failed > /tmp/failure-log.txt 2>&1 || true
          echo "Failure log collected for run $RUN_ID"

      - name: Create fix branch and PR
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="fix/auto-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          # Agent applies fixes here
          # git add . && git commit -m "fix: auto-fix CI failure"
          # git push origin "$BRANCH"
          # gh pr create --title "fix: auto-fix CI failure" --label "auto-fix"
