# Coding Engine — Auto-Merge Workflow Template
#
# Automatically merges PRs from agent branches when CI passes.
# Copy to .github/workflows/auto-merge.yml and update variables.

name: Auto-Merge

on:
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    steps:
      - name: Find mergeable PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # UPDATE: Use PAT if needed
        run: |
          # Find PRs from agent branches with passing checks
          gh pr list \
            --state open \
            --json number,headRefName,statusCheckRollup \
            --jq '.[] | select(.headRefName | startswith("claude/")) | .number' |
          while read -r PR_NUMBER; do
            echo "Checking PR #$PR_NUMBER..."
            STATUS=$(gh pr checks "$PR_NUMBER" --json state --jq '.[].state' | sort -u)
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Merging PR #$PR_NUMBER..."
              gh pr merge "$PR_NUMBER" --squash --auto
            fi
          done
